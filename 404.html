<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trip Planner</title>
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./img/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trip Planner" />
    <meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="./css/styles.css" />
    <main class="app-main">
      <div class="center-card">
        <a class="app-brand" href="./" style="display: flex; justify-content: center; margin-bottom: var(--space-4);">
          <img class="app-logo" src="./img/logo.svg" alt="" width="28" height="28" />
          <span class="app-name">Trip Planner</span>
        </a>
        <h1 style="text-align: center; margin: 0 0 var(--space-3);">Page not found</h1>
        <button class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);" onclick="location.href='./'">Back to your trips</button>
      </div>
    </main>
  </body>
</html>
